{% extends "layout.html" %} {% block content %}

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="chat-hero">
        <div class="chat-hero-icon">💬</div>
        <h1>Chat with our hotel assistant</h1>
        <p>
          Ask about hotels, amenities, budget, or what other guests have said.
        </p>
      </div>

      <section class="bg-white rounded-4 shadow-sm p-4 p-md-5">
        <div
          id="chat-messages"
          class="d-flex flex-column gap-3 mb-4"
          style="max-height: 500px; overflow-y: auto; padding: 0.5rem"
        ></div>

        <form id="chat-form" class="d-flex gap-2">
          <input
            type="text"
            id="chat-input"
            class="form-control form-control-lg"
            placeholder="e.g. A pet-friendly hotel in Tokyo with a gym, under $200"
            required
          />
          <button
            type="submit"
            class="btn btn-hotel-confirm btn-lg"
            style="white-space: nowrap"
          >
            Send
          </button>
        </form>
      </section>
    </div>
  </div>
</main>

<script>
  const chatMessages = document.getElementById('chat-messages');
  const chatForm = document.getElementById('chat-form');
  const chatInput = document.getElementById('chat-input');

  let lastQuery = null;
  let lastOffset = 0;

  function addMessage(role, html) {
    const bubble = document.createElement('div');
    bubble.className =
      role === 'guest'
        ? 'chat-bubble chat-bubble-guest'
        : 'chat-bubble chat-bubble-ai';
    bubble.innerHTML = html;
    chatMessages.appendChild(bubble);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return bubble;
  }

  function addTypingIndicator() {
    return addMessage(
      'ai',
      `
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    `,
    );
  }

  async function runSearch(query, offset) {
    const thinkingBubble = addTypingIndicator();

    const response = await fetch(
      `/search/ai/api?query=${encodeURIComponent(query)}&offset=${offset}`,
    );
    const data = await response.json();

    thinkingBubble.remove();

    let html = data.recommendation.replace(/\n/g, '<br>');
    if (data.has_more) {
      html += `<div class="mt-3"><button type="button" class="btn btn-sm btn-manage-outline" onclick="showMore()">Show me more options</button></div>`;
    }
    addMessage('ai', html);

    lastQuery = query;
    lastOffset = data.next_offset;
  }

  function showMore() {
    runSearch(lastQuery, lastOffset);
  }

  chatForm.addEventListener('submit', function (event) {
    event.preventDefault();
    const query = chatInput.value.trim();
    if (!query) return;

    addMessage('guest', query);
    chatInput.value = '';

    runSearch(query, 0);
  });
</script>

{% endblock content %}

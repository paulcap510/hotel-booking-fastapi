{% extends "layout.html" %} {% block content %}

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="text-center mb-5">
        <h1 class="fw-bold mb-2">Describe your ideal stay</h1>
        <p class="text-muted">
          Tell us what you're looking for — amenities, budget, or what other
          guests have said.
        </p>
      </div>

      <section class="bg-white rounded-4 shadow-sm p-4 p-md-5">
        <form method="get" action="/search/ai">
          <div class="mb-4">
            <label class="form-label fw-bold">What are you looking for?</label>
            <textarea
              class="form-control form-control-lg"
              name="query"
              rows="3"
              placeholder="e.g. A hotel that accepts pets, has a gym, is under $200 a night, and has positive reviews about the pet experience"
              required
            >
{{ query or '' }}</textarea
            >
          </div>

          <button type="submit" class="btn btn-hotel-confirm btn-lg w-100">
            Search
          </button>
        </form>
      </section>

      {% if results %}
      <div class="mt-5">
        <h4 class="fw-bold mb-3">Results</h4>
        <p class="text-muted">
          Results will render here once the search logic is built.
        </p>
      </div>
      {% endif %}
    </div>
  </div>
</main>

{% endblock content %}

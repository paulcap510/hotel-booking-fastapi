{% extends "layout.html" %}

{% block content %}

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<main class="container py-5">

  <div class="row justify-content-center">
    <div class="col-lg-7">

      <div class="mb-4">
        <a href="{{ url_for('host_dashboard') }}" class="text-decoration-none text-muted small">
          &larr; Back to dashboard
        </a>
      </div>

      <h1 class="fw-bold mb-2">List a new property</h1>
      <p class="text-muted mb-5">Fill in the details below to create your listing.</p>

      <section class="bg-white rounded-4 shadow-sm p-4 p-md-5">

        <form method="post" action="/host/properties/new" enctype="multipart/form-data">

          <div class="mb-3">
            <label class="form-label fw-bold">Property name</label>
            <input
              type="text"
              class="form-control form-control-lg"
              name="name"
              placeholder="e.g. Sakura Grand Hotel"
              required
            >
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">City</label>
            <input
              type="text"
              class="form-control form-control-lg"
              name="city"
              id="city-input"
              placeholder="e.g. Tokyo"
              required
            >
            <button type="button" id="check-location-btn" class="btn btn-manage-outline btn-sm mt-2">
              📍 Confirm location
            </button>
            <div id="location-status" class="form-text mt-2"></div>
            <div id="location-candidates" class="mt-2 d-flex flex-column gap-2"></div>
          </div>

          <input type="hidden" name="latitude" id="latitude-input">
          <input type="hidden" name="longitude" id="longitude-input">

          <div id="map-preview" style="height: 250px; border-radius: 12px; display: none;" class="mb-3"></div>

          <div class="mb-3">
            <label class="form-label fw-bold">Description</label>
            <textarea
              class="form-control"
              name="description"
              rows="4"
              placeholder="Describe your property — location, atmosphere, nearby attractions..."
              required
            ></textarea>
          </div>

          <div class="mb-4">
            <label class="form-label fw-bold">Image URL</label>
            <input
              type="file"
              class="form-control"
              name="image"
              accept="image/*"
              required
            >
            <div class="form-text">
                Upload a photo of your property.
            </div>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-host-action btn-lg w-50">
              Create listing
            </button>
          </div>

        </form>

      </section>

    </div>
  </div>

</main>

<script>
  const checkLocationBtn = document.getElementById("check-location-btn");
  const cityInput = document.getElementById("city-input");
  const locationStatus = document.getElementById("location-status");
  const candidatesContainer = document.getElementById("location-candidates");
  const mapContainer = document.getElementById("map-preview");
  const latitudeInput = document.getElementById("latitude-input");
  const longitudeInput = document.getElementById("longitude-input");

  let map = null;
  let marker = null;

  function showLocationOnMap(lat, lon) {
    latitudeInput.value = lat;
    longitudeInput.value = lon;
    mapContainer.style.display = "block";

    if (!map) {
      map = L.map("map-preview").setView([lat, lon], 12);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
        attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
      }).addTo(map);
      marker = L.marker([lat, lon]).addTo(map);
    } else {
      map.setView([lat, lon], 12);
      marker.setLatLng([lat, lon]);
    }
  }

  checkLocationBtn.addEventListener("click", async function () {
    const city = cityInput.value.trim();
    candidatesContainer.innerHTML = "";
    mapContainer.style.display = "none";

    if (!city) {
      locationStatus.textContent = "Enter a city first.";
      return;
    }

    locationStatus.textContent = "Checking...";

    const response = await fetch(`/host/properties/geocode-preview?city=${encodeURIComponent(city)}`);
    const data = await response.json();

    if (!data.results || data.results.length === 0) {
      locationStatus.textContent = "Could not find that location. Try being more specific.";
      return;
    }

    if (data.results.length === 1) {
      locationStatus.textContent = "Location found — confirm this looks correct below.";
      showLocationOnMap(data.results[0].latitude, data.results[0].longitude);
      return;
    }

    locationStatus.textContent = "Multiple matches found — pick the correct one:";

    data.results.forEach(function (result) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn btn-manage-outline btn-sm text-start";
      btn.textContent = result.display_name;
      btn.addEventListener("click", function () {
        showLocationOnMap(result.latitude, result.longitude);
        locationStatus.textContent = "Selected: " + result.display_name;
        candidatesContainer.innerHTML = "";
      });
      candidatesContainer.appendChild(btn);
    });
  });
</script>

{% endblock content %}
